name: Unpack final GDN assets
on:
  push:
    paths:
      - '.github/workflows/unpack-gdn-assets.yml'
      - 'assets/gdn-final-web.zip.b64.part6'
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and unpack final GDN web assets
        run: |
          cat assets/gdn-final-web.zip.b64.part1 \
              assets/gdn-final-web.zip.b64.part2 \
              assets/gdn-final-web.zip.b64.part3 \
              assets/gdn-final-web.zip.b64.part4 \
              assets/gdn-final-web.zip.b64.part5 \
              assets/gdn-final-web.zip.b64.part6 \
            | base64 -d > assets/gdn-final-web.zip
          mkdir -p assets/gdn
          unzip -o assets/gdn-final-web.zip -d assets/gdn
          rm -f assets/gdn-final-web.zip \
                assets/gdn-final-web.zip.b64.part1 \
                assets/gdn-final-web.zip.b64.part2 \
                assets/gdn-final-web.zip.b64.part3 \
                assets/gdn-final-web.zip.b64.part4 \
                assets/gdn-final-web.zip.b64.part5 \
                assets/gdn-final-web.zip.b64.part6
          git config user.name "portfolio-ui-bot"
          git config user.email "portfolio-ui-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add final GDN gallery assets"
          git push origin HEAD:main

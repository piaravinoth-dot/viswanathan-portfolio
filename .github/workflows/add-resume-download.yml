name: Add recruiter resume download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-resume-download.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update resume CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('resume.html')
          s = p.read_text()
          old = '<div class="actions"><button class="btn primary" onclick="window.print()">SAVE / PRINT ↓</button><a class="btn" href="/portfolio">VIEW PORTFOLIO ↗</a></div>'
          new = '<div class="actions"><a class="btn primary" href="/assets/resume/Viswanathan_G_Recruiter_Resume_2026.pdf" download>DOWNLOAD PDF ↓</a><button class="btn" onclick="window.print()">PRINT / SAVE</button><a class="btn" href="/portfolio">VIEW PORTFOLIO ↗</a></div>'
          if old not in s:
              raise SystemExit('Expected actions block not found')
          s = s.replace(old, new, 1)
          s = s.replace('.actions{display:grid;grid-template-columns:1fr 1fr}', '.actions{display:grid;grid-template-columns:1fr}', 1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/add-resume-download.yml
      - name: Commit changes
        run: |
          git config user.name "portfolio-application-bot"
          git config user.email "portfolio-application-bot@users.noreply.github.com"
          git add resume.html .github/workflows/add-resume-download.yml
          git commit -m "Add downloadable recruiter resume"
          git push

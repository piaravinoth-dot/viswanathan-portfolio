name: Journey Map Preview QA
on:
  push:
    branches:
      - experiment/journey-editorial
    paths:
      - "public/journey-lab/**"
      - "scripts/qa-journey.mjs"
      - ".github/workflows/journey-preview-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journey-preview
  cancel-in-progress: true
jobs:
  chromium-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Build preview
        run: npm run build
      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/journey-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/journey-lab/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/journey-preview.log
          exit 1
      - name: Test interactions across screen sizes
        run: node scripts/qa-journey.mjs
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-map-preview-qa
          path: |
            qa-journey-results.json
            qa-journey-iphone.png
            qa-journey-desktop.png
          if-no-files-found: ignore
          retention-days: 7

name: Isolated AI Design Motion Pilot QA
on:
  push:
    branches:
      - 'pilot/ai-design-studio-motion-2026'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing app and preview test tools
        run: |
          npm install --no-audit
          npm install --no-save --ignore-scripts playwright lighthouse
      - name: Install three browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build the isolated preview
        run: npm run build
      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/motion-preview.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/work/ai-design-studio >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motion-preview.log
          exit 1
      - name: Validate animations, mobile and reduced motion
        run: node scripts/qa-motion-pilot.mjs
      - name: Cross-browser and responsive visual QA
        run: node scripts/qa-motion-crossbrowser.mjs
      - name: Lighthouse mobile
        run: npx lighthouse http://127.0.0.1:4173/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=motion-lighthouse-mobile.json --quiet
      - name: Lighthouse desktop
        run: npx lighthouse http://127.0.0.1:4173/work/ai-design-studio --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=motion-lighthouse-desktop.json --quiet
      - name: Check out untouched production baseline for an apples-to-apples comparison
        uses: actions/checkout@v4
        with:
          ref: cb55eb3a1b85d87ae6128a5d749b5488909d0e6c
          path: baseline
      - name: Build baseline case study on separate local port
        run: |
          cd baseline
          npm install --no-audit
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 4174 >/tmp/baseline-preview.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4174/work/ai-design-studio >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/baseline-preview.log
          exit 1
      - name: Capture matching original and pilot visuals plus timing
        run: node scripts/qa-motion-visual-compare.mjs
      - name: Capture and compare pilot with untouched baseline in 3 browser engines
        run: node scripts/qa-visual-compare.mjs
      - name: Lighthouse baseline mobile
        run: npx lighthouse http://127.0.0.1:4174/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=baseline-lighthouse-mobile.json --quiet
      - name: Lighthouse baseline desktop
        run: npx lighthouse http://127.0.0.1:4174/work/ai-design-studio --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=baseline-lighthouse-desktop.json --quiet
      - name: Lighthouse repeat mobile baseline round 2
        run: npx lighthouse http://127.0.0.1:4174/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=baseline-lighthouse-mobile-2.json --quiet
      - name: Lighthouse repeat mobile pilot round 2
        run: npx lighthouse http://127.0.0.1:4173/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=motion-lighthouse-mobile-2.json --quiet
      - name: Lighthouse repeat mobile pilot round 3
        run: npx lighthouse http://127.0.0.1:4173/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=motion-lighthouse-mobile-3.json --quiet
      - name: Lighthouse repeat mobile baseline round 3
        run: npx lighthouse http://127.0.0.1:4174/work/ai-design-studio --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=baseline-lighthouse-mobile-3.json --quiet
      - name: Compare three mobile rounds and desktop against untouched baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const median=a=>{const xs=[...a].sort((x,y)=>x-y);return xs[Math.floor(xs.length/2)]};
          const read=(name)=>JSON.parse(fs.readFileSync(name+'.json','utf8'));
          const p=read('motion-lighthouse-mobile'),b=read('baseline-lighthouse-mobile');
          const pm=[p,read('motion-lighthouse-mobile-2'),read('motion-lighthouse-mobile-3')];
          const bm=[b,read('baseline-lighthouse-mobile-2'),read('baseline-lighthouse-mobile-3')];
          const score=(r,k)=>Math.round(r.categories[k].score*100);
          const audit=(r,k)=>r.audits[k].numericValue;
          const summarize=r=>({
            performanceMedian:median(r.map(x=>score(x,'performance'))),
            accessibilityMin:Math.min(...r.map(x=>score(x,'accessibility'))),
            seoMin:Math.min(...r.map(x=>score(x,'seo'))),
            lcpMedian:median(r.map(x=>audit(x,'largest-contentful-paint'))),
            clsMedian:median(r.map(x=>audit(x,'cumulative-layout-shift'))),
            tbtMedian:median(r.map(x=>audit(x,'total-blocking-time'))),
            performanceSamples:r.map(x=>score(x,'performance'))
          });
          const pilot=summarize(pm),baseline=summarize(bm);
          const d=read('motion-lighthouse-desktop'),bd=read('baseline-lighthouse-desktop');
          const desktopPilot=Object.fromEntries(Object.keys(d.categories).map(k=>[k,score(d,k)]));
          const desktopBaseline=Object.fromEntries(Object.keys(bd.categories).map(k=>[k,score(bd,k)]));
          const report={mobile:{pilot,baseline},desktop:{pilot:desktopPilot,baseline:desktopBaseline}};
          console.log(JSON.stringify(report,null,2));
          fs.writeFileSync('motion-final-lighthouse-summary.json',JSON.stringify(report,null,2));
          if(pilot.performanceMedian < baseline.performanceMedian-5)process.exitCode=1;
          if(pilot.accessibilityMin < baseline.accessibilityMin)process.exitCode=1;
          if(pilot.seoMin < baseline.seoMin)process.exitCode=1;
          if(pilot.lcpMedian > baseline.lcpMedian+450)process.exitCode=1;
          if(pilot.clsMedian > baseline.clsMedian+.01)process.exitCode=1;
          if(desktopPilot.performance < desktopBaseline.performance-5)process.exitCode=1;
          if(desktopPilot.accessibility < desktopBaseline.accessibility)process.exitCode=1;
          NODE
      - name: Save visual preview and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-design-motion-pilot
          path: |
            motion-pilot-results.json
            motion-crossbrowser-results.json
            motion-visual-compare.json
            visual-*.png
            motion-compare-*.png
            motion-timing-*.png
            motion-visual-comparison.json
            motion-crossbrowser-*.png
            motion-final-lighthouse-summary.json
            motion-lighthouse-mobile-2.json
            motion-lighthouse-mobile-3.json
            baseline-lighthouse-mobile-2.json
            baseline-lighthouse-mobile-3.json
            motion-pilot-375.png
            motion-pilot-1440.png
            motion-lighthouse-mobile.json
            motion-lighthouse-desktop.json
            baseline-lighthouse-mobile.json
            baseline-lighthouse-desktop.json
          if-no-files-found: ignore

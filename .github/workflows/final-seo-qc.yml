name: Final SEO QC

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-seo-qc.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize portfolio metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          BASE = "https://viswanathan-portfolio-iota.vercel.app"
          SOCIAL = f"{BASE}/og-image.png"
          routes = {
              "index.html": "/",
              "portfolio.html": "/portfolio",
              "about.html": "/about",
              "resume.html": "/resume",
              "contact.html": "/contact",
              "work/ai-design-studio.html": "/work/ai-design-studio",
              "work/consulting-website.html": "/work/consulting-website",
              "work/campaign-systems.html": "/work/campaign-systems",
          }

          def meta_content(text, name=None, prop=None):
              key = f'name="{name}"' if name else f'property="{prop}"'
              m = re.search(r'<meta\s+[^>]*' + re.escape(key) + r'[^>]*content="([^"]*)"[^>]*>', text)
              return m.group(1) if m else ""

          for file, route in routes.items():
              p = Path(file)
              text = p.read_text(encoding="utf-8")
              canonical = BASE + route
              title_m = re.search(r'<title>(.*?)</title>', text, re.S)
              title = title_m.group(1).strip() if title_m else "Viswanathan G"
              desc = meta_content(text, name="description") or "Portfolio of Viswanathan G — Art Director, UI/UX Designer and Creative Technologist."

              # Canonical + clean internal URLs.
              if re.search(r'<link\s+rel="canonical"[^>]*>', text):
                  text = re.sub(r'<link\s+rel="canonical"[^>]*>', f'<link rel="canonical" href="{canonical}">', text, count=1)
              else:
                  text = text.replace('</title>', f'</title>\n<link rel="canonical" href="{canonical}">', 1)

              replacements = {
                  'href="index.html"': 'href="/"',
                  'href="portfolio.html"': 'href="/portfolio"',
                  'href="about.html"': 'href="/about"',
                  'href="resume.html"': 'href="/resume"',
                  'href="contact.html"': 'href="/contact"',
                  'href="../portfolio.html"': 'href="/portfolio"',
                  'href="../about.html"': 'href="/about"',
                  'href="../resume.html"': 'href="/resume"',
                  'href="../contact.html"': 'href="/contact"',
                  'href="work/ai-design-studio.html"': 'href="/work/ai-design-studio"',
                  'href="work/consulting-website.html"': 'href="/work/consulting-website"',
                  'href="work/campaign-systems.html"': 'href="/work/campaign-systems"',
                  'href="../index.html"': 'href="/"',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Root-safe favicon and manifest.
              text = re.sub(r'<link\s+rel="icon"\s+href="[^"]+"\s+type="image/svg\+xml">', '<link rel="icon" href="/favicon.svg" type="image/svg+xml">', text, count=1)
              if '<link rel="manifest"' not in text:
                  text = text.replace('<link rel="icon" href="/favicon.svg" type="image/svg+xml">', '<link rel="icon" href="/favicon.svg" type="image/svg+xml">\n<link rel="manifest" href="/site.webmanifest">', 1)

              # Social metadata: stable local preview image and clean URLs.
              og_type = "article" if file.startswith("work/") else "website"
              tags = [
                  f'<meta property="og:title" content="{title}">',
                  f'<meta property="og:description" content="{desc}">',
                  f'<meta property="og:type" content="{og_type}">',
                  f'<meta property="og:url" content="{canonical}">',
                  f'<meta property="og:image" content="{SOCIAL}">',
                  '<meta property="og:image:width" content="1200">',
                  '<meta property="og:image:height" content="630">',
                  '<meta property="og:image:alt" content="Viswanathan G — Art Director, UI/UX Designer and Creative Technologist">',
                  '<meta name="twitter:card" content="summary_large_image">',
                  f'<meta name="twitter:title" content="{title}">',
                  f'<meta name="twitter:description" content="{desc}">',
                  f'<meta name="twitter:image" content="{SOCIAL}">',
              ]

              # Remove existing OG/Twitter tags we manage, then insert one clean block.
              managed_patterns = [
                  r'\s*<meta\s+property="og:(?:title|description|type|url|image|image:width|image:height|image:alt)"[^>]*>',
                  r'\s*<meta\s+name="twitter:(?:card|title|description|image)"[^>]*>',
              ]
              for pat in managed_patterns:
                  text = re.sub(pat, '', text)
              marker = '<link rel="manifest" href="/site.webmanifest">'
              text = text.replace(marker, marker + '\n' + '\n'.join(tags), 1)

              if '<meta name="robots"' not in text:
                  text = text.replace('<meta name="theme-color"', '<meta name="robots" content="index,follow,max-image-preview:large">\n<meta name="theme-color"', 1)

              p.write_text(text, encoding="utf-8")

          # Add structured data to the homepage only.
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          if 'application/ld+json' not in text:
              data = {
                  "@context": "https://schema.org",
                  "@graph": [
                      {
                          "@type": "Person",
                          "name": "Viswanathan G",
                          "url": BASE + "/",
                          "jobTitle": "Art Director · UI/UX Designer · Creative Technologist",
                          "sameAs": [
                              "https://in.linkedin.com/in/viswanathan-g-55a0176a",
                              "https://www.behance.net/--11"
                          ],
                          "knowsAbout": [
                              "Art Direction",
                              "UI/UX Design",
                              "Creative Technology",
                              "Campaign Systems",
                              "AI-Assisted Design"
                          ]
                      },
                      {
                          "@type": "WebSite",
                          "name": "Viswanathan G Portfolio",
                          "url": BASE + "/"
                      }
                  ]
              }
              block = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + '</script>'
              text = text.replace('</head>', block + '\n</head>', 1)
              p.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/final-seo-qc.yml
          git config user.name "portfolio-qc-bot"
          git config user.email "portfolio-qc-bot@users.noreply.github.com"
          git add -A
          git commit -m "Finalize SEO metadata and clean portfolio routes"
          git push origin main

name: Interactive Tools Orbit Preview QA
on:
  push:
    branches:
      - experiment/interactive-tools-orbit-20261026
    paths:
      - "src/components/ToolsOrbit.tsx"
      - "src/components/styles/ToolsOrbit.css"
      - "src/components/MainContainer.tsx"
      - "scripts/qa-tools-orbit.mjs"
      - ".github/workflows/toolkit-orbit-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-orbit-preview
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright
          google-chrome --version
      - name: Build preview
        run: npm run build
      - name: Start test server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/qa-toolkit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qa-toolkit.log
          exit 1
      - name: Responsive browser QA
        run: node scripts/qa-tools-orbit.mjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tools-orbit-preview-qa
          path: |
            qa-tools-results.json
            qa-tools-iphone.png
            qa-tools-desktop.png
          if-no-files-found: ignore
          retention-days: 7

name: Replace resume tools with aligned matrix

on:
  push:
    paths:
      - '.github/workflows/tools-matrix-v2.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy tools section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('resume.html')
          html = path.read_text(encoding='utf-8')

          # Remove any previous V2 block before inserting a fresh one.
          html = re.sub(r'<style id="tools-matrix-v2">.*?</style>', '', html, flags=re.S)

          css = r'''
          <style id="tools-matrix-v2">
          .tools-matrix-v2{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:14px!important;width:100%!important;align-items:stretch!important}
          .tools-matrix-v2 .tool-tile-v2{min-width:0!important;height:92px!important;border:1px solid rgba(16,16,20,.13)!important;border-radius:18px!important;background:#f8f7f2!important;padding:14px 15px!important;display:flex!important;align-items:center!important;gap:12px!important;box-shadow:none!important;overflow:hidden!important;transition:transform .18s ease,border-color .18s ease,background .18s ease!important}
          .tools-matrix-v2 .tool-tile-v2:hover{transform:translateY(-2px)!important;border-color:rgba(41,66,255,.28)!important;background:#fff!important}
          .tool-mark-v2{width:44px!important;height:44px!important;min-width:44px!important;flex:0 0 44px!important;border-radius:12px!important;display:grid!important;place-items:center!important;border:1px solid rgba(16,16,20,.11)!important;background:#fff!important;font-size:12px!important;line-height:1!important;font-weight:900!important;letter-spacing:-.03em!important;color:#101014!important;position:relative!important;overflow:hidden!important}
          .tool-mark-v2.ps{background:#001e36!important;color:#31a8ff!important;border-color:#163c58!important}.tool-mark-v2.ai-adobe{background:#330000!important;color:#ff9a00!important;border-color:#6a3514!important}.tool-mark-v2.pr{background:#00005b!important;color:#9999ff!important;border-color:#2c2c87!important}.tool-mark-v2.figma{background:#fff!important;color:#101014!important}.tool-mark-v2.corel{background:#0a7a39!important;color:#fff!important;border-color:#0a7a39!important}.tool-mark-v2.mid{background:#101014!important;color:#fff!important;border-color:#101014!important}.tool-mark-v2.firefly{background:#281100!important;color:#ff8a00!important;border-color:#603c11!important}.tool-mark-v2.codex{background:#111!important;color:#fff!important;border-color:#111!important}.tool-mark-v2.genai{background:#2942ff!important;color:#fff!important;border-color:#2942ff!important}.tool-mark-v2.rwd{background:#fff!important;color:#2942ff!important;border-color:rgba(41,66,255,.25)!important}
          .tool-mark-v2.figma::before{content:'';width:20px;height:30px;background:radial-gradient(circle at 25% 17%,#f24e1e 0 5px,transparent 5.5px),radial-gradient(circle at 75% 17%,#ff7262 0 5px,transparent 5.5px),radial-gradient(circle at 25% 50%,#a259ff 0 5px,transparent 5.5px),radial-gradient(circle at 75% 50%,#1abcfe 0 5px,transparent 5.5px),radial-gradient(circle at 25% 83%,#0acf83 0 5px,transparent 5.5px)}
          .tool-copy-v2{min-width:0!important;display:flex!important;flex-direction:column!important;gap:4px!important}.tool-name-v2{font-size:13px!important;line-height:1.15!important;font-weight:800!important;color:#101014!important;white-space:normal!important}.tool-type-v2{font-size:8px!important;line-height:1.2!important;font-weight:900!important;letter-spacing:.1em!important;text-transform:uppercase!important;color:#77777f!important}
          @media(max-width:1200px) and (min-width:901px){.tools-matrix-v2{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
          @media(max-width:900px){.tools-matrix-v2{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.tools-matrix-v2 .tool-tile-v2{height:76px!important;padding:11px 12px!important;border-radius:16px!important;gap:10px!important}.tool-mark-v2{width:38px!important;height:38px!important;min-width:38px!important;flex-basis:38px!important;border-radius:10px!important;font-size:10px!important}.tool-name-v2{font-size:11px!important}.tool-type-v2{font-size:7px!important}}
          @media(max-width:480px){.tools-matrix-v2{grid-template-columns:1fr!important}.tools-matrix-v2 .tool-tile-v2{height:70px!important}}
          @media print{.tools-matrix-v2{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}.tools-matrix-v2 .tool-tile-v2{height:58px!important;padding:7px!important;border-radius:9px!important;background:#fff!important}.tool-mark-v2{width:30px!important;height:30px!important;min-width:30px!important;flex-basis:30px!important;border-radius:7px!important;background:#fff!important;color:#101014!important;border-color:#ccc!important}.tool-name-v2{font-size:8px!important}.tool-type-v2{display:none!important}}
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>')

          section = r'''<section class="row"><div class="row-label"><span>04 / Tools</span><h2>Hands-on.</h2></div><div class="tools-matrix-v2" aria-label="Design and creative technology tools">
          <div class="tool-tile-v2"><span class="tool-mark-v2 ps">Ps</span><span class="tool-copy-v2"><span class="tool-name-v2">Adobe Photoshop</span><span class="tool-type-v2">Image & compositing</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 ai-adobe">Ai</span><span class="tool-copy-v2"><span class="tool-name-v2">Illustrator</span><span class="tool-type-v2">Vector design</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 pr">Pr</span><span class="tool-copy-v2"><span class="tool-name-v2">Premiere Pro</span><span class="tool-type-v2">Video editing</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 figma" aria-label="Figma logo"></span><span class="tool-copy-v2"><span class="tool-name-v2">Figma</span><span class="tool-type-v2">UI/UX & systems</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 corel">CD</span><span class="tool-copy-v2"><span class="tool-name-v2">CorelDRAW</span><span class="tool-type-v2">Print & vector</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 mid">MJ</span><span class="tool-copy-v2"><span class="tool-name-v2">Midjourney</span><span class="tool-type-v2">Generative image</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 firefly">Ff</span><span class="tool-copy-v2"><span class="tool-name-v2">Adobe Firefly</span><span class="tool-type-v2">Generative design</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 codex">&lt;/&gt;</span><span class="tool-copy-v2"><span class="tool-name-v2">Codex</span><span class="tool-type-v2">Design to code</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 genai">AI</span><span class="tool-copy-v2"><span class="tool-name-v2">Generative AI</span><span class="tool-type-v2">Creative workflows</span></span></div>
          <div class="tool-tile-v2"><span class="tool-mark-v2 rwd">RWD</span><span class="tool-copy-v2"><span class="tool-name-v2">Responsive Design</span><span class="tool-type-v2">Web systems</span></span></div>
          </div></section>'''

          pattern = r'<section class="row"><div class="row-label"><span>04 / Tools</span><h2>Hands-on\.</h2></div>.*?</section>'
          new_html, count = re.subn(pattern, section, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one tools section, replaced {count}')
          if 'class="skills"' in new_html[new_html.find('04 / Tools'):new_html.find('05 / Proof')]:
              raise SystemExit('Legacy skills markup still present inside tools section')
          path.write_text(new_html, encoding='utf-8')
          PY

      - name: Verify tools matrix
        run: |
          grep -q 'tools-matrix-v2' resume.html
          grep -q 'Image & compositing' resume.html
          grep -q 'UI/UX & systems' resume.html

      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name "portfolio-ui-bot"
          git config user.email "portfolio-ui-bot@users.noreply.github.com"
          git add resume.html
          git commit -m "Replace resume tool pills with aligned matrix"
          git rm .github/workflows/tools-matrix-v2.yml
          git commit -m "Remove one-time tools matrix workflow"
          git push

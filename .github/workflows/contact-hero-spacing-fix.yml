name: Tighten contact hero spacing
on:
  push:
    paths:
      - '.github/workflows/contact-hero-spacing-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact hero spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contact.html')
          s = p.read_text()
          old = '.hero{min-height:calc(100svh - 72px);padding:8vh 32px 48px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}.hero-inner{width:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr);gap:8vw;align-items:end}'
          new = '.hero{min-height:auto;padding:88px 32px 76px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.hero-inner{width:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr);gap:8vw;align-items:center}'
          if old not in s:
              raise SystemExit('Target contact hero CSS not found')
          s = s.replace(old, new, 1)
          s = s.replace('.hero{min-height:auto;padding:60px 18px 48px}', '.hero{min-height:auto;padding:48px 18px 46px}', 1)
          p.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'portfolio-ui-bot'
          git config user.email 'portfolio-ui-bot@users.noreply.github.com'
          git rm .github/workflows/contact-hero-spacing-fix.yml
          git add contact.html
          git commit -m 'Reduce contact hero whitespace'
          git push

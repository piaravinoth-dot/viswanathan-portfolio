name: Journey Portfolio Integration QA
on:
  push:
    branches:
      - feature/journey-map-integration-20261025
      - viswanathan-g
    paths:
      - "public/journey/**"
      - "src/components/About.tsx"
      - "src/components/styles/About.css"
      - "scripts/qa-journey.mjs"
      - "vercel.json"
      - ".github/workflows/journey-integration-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journey-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Build portfolio and verify SEO
        run: npm run build
      - name: Serve built site
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/journey-integration.log 2>&1 &
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:4173/journey/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/journey-integration.log
          exit 1
      - name: Validate responsive journey and About integration
        run: node scripts/qa-journey.mjs
      - name: Store screenshots and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-integration-qa
          path: |
            qa-journey-results.json
            qa-journey-iphone.png
            qa-journey-desktop.png
          if-no-files-found: ignore
          retention-days: 14

name: Portfolio Browser QA
on:
  push:
    branches: [viswanathan-g, review/fix-current-gallery-browser-qa-20261026]
    paths:
      - 'src/**'
      - 'scripts/qa-browser.mjs'
      - 'scripts/qa-accessibility.mjs'
      - '.github/workflows/portfolio-browser-qa.yml'
      - 'index.html'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-qa-rebuild
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install portfolio and browser test dependencies
        run: |
          npm install --no-audit
          npm install --no-save --ignore-scripts playwright axe-core
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build production source with SEO checks
        run: npm run build
      - name: Start isolated local production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Test built portfolio in 3 engines and 7 viewport widths
        env:
          QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-browser.mjs
      - name: WCAG accessibility checks for mobile, desktop and case study
        env:
          QA_URL: http://127.0.0.1:4173
        run: node scripts/qa-accessibility.mjs
      - name: Audit runtime dependency vulnerabilities
        run: |
          npm audit --omit=dev --json > qa-dependency-audit.json || true
          node -e "const r=require('./qa-dependency-audit.json'); const v=r.metadata?.vulnerabilities; console.log('Runtime vulnerabilities:',v); if((v?.critical||0)+(v?.high||0)>0)process.exitCode=1"
      - name: Store browser QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: |
            qa-browser-results.json
            qa-accessibility-results.json
            qa-dependency-audit.json
          if-no-files-found: ignore
